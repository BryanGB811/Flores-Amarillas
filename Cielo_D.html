<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Amarillas</title>

    <!-- Tipografías caligráficas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Dancing+Script:wght@500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="Diseño.css">
</head>

<body>

    <!-- Hojitas decoradas de fondo (esquinas) -->
    <div class="ambient" aria-hidden="true"></div>

    <main class="spring-page">

        <!-- =========================================================
             LADO IZQUIERDO: EL CUADRO
             ========================================================= -->
        <section class="garden-section">

            <div class="garden-frame">
                <div class="garden-mat">

                    <!-- Nombre (el JS lo separa en letras para animarlo) -->
                    <header class="garden-title">
                        <h2 id="garden-name">Para Cielo!!!</h2>
                        <div class="title-flourish" aria-hidden="true">
                        </div>
                    </header>

                    <!-- Jardín (lo dibuja el JS) -->
                    <div class="garden-ground" aria-hidden="true"></div>
                    <div id="sunflower-garden" aria-hidden="true"></div>

                </div>
            </div>

        </section>


        <!-- =========================================================
             LADO DERECHO: MENSAJE + REPRODUCTOR
             ========================================================= -->
        <section class="message-section">

            <div class="message-container">

                <h1 id="spring-message">
                    <span id="typed-text"></span><span class="writing-cursor" aria-hidden="true"></span>
                </h1>


                <!-- =============================================
                     REPRODUCTOR DE MÚSICA
                     ============================================= -->
                <section class="music-player" id="musicPlayer" aria-label="Reproductor de música">

                    <div class="player-head">
                        <div class="player-disc" id="playerDisc" aria-hidden="true">
                            <span class="disc-flower">❁</span>
                        </div>

                        <div class="player-meta">
                            <p class="player-track">La canción del día</p>
                            <p class="player-state" id="playerState">Listo para sonar</p>
                        </div>
                    </div>

                    <div class="player-progress">
                        <input type="range" class="range seek" id="seek"
                               min="0" max="100" step="0.1" value="0"
                               aria-label="Avance de la canción">
                        <div class="player-times">
                            <span id="timeCurrent">0:00</span>
                            <span id="timeTotal">0:00</span>
                        </div>
                    </div>

                    <div class="player-controls">
                        <button class="player-btn" id="btnBack" type="button" aria-label="Retroceder 10 segundos">«</button>

                        <button class="player-btn play" id="btnPlay" type="button" aria-label="Reproducir">
                            <span id="playIcon">▶</span>
                        </button>

                        <button class="player-btn" id="btnFwd" type="button" aria-label="Adelantar 10 segundos">»</button>

                        <div class="player-volume">
                            <button class="player-btn small" id="btnMute" type="button" aria-label="Silenciar">
                                <span id="muteIcon">♪</span>
                            </button>
                            <input type="range" class="range volume" id="volume"
                                   min="0" max="1" step="0.01" value="0.55"
                                   aria-label="Volumen">
                        </div>
                    </div>

                    <audio id="musica" loop preload="metadata">
                        <source src="cancion.mp3" type="audio/mpeg">
                    </audio>

                </section>

            </div>

        </section>

    </main>

    <script src="Animacion_C.js"></script>

</body>
</html>
